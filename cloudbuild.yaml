# Google Cloud Build configuration
# Builds/pushes all microservice images and deploys to Cloud Run
# Branch-based triggers will override the _ENV substitution (dev|staging|prod)

substitutions:
  _REGION: europe-west3
  _REPO: online-platform
  _REG: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}'
  _TAG: '$SHORT_SHA'
  _SERVICES: 'api-gateway,user-service,course-service,media-service,payment-service,notification-service'
  _FRONTEND: 'frontend'
  _ENV: 'dev'

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  machineType: 'E2_HIGHCPU_8'

steps:
# Build and push each service image
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build & Push images'
  entrypoint: bash
  args:
    - -c
    - |
      set -e
      IFS=',' read -ra SRVS <<< "${_SERVICES}"
      for svc in "${SRVS[@]}"; do
        echo "---- Building $svc ----"
        docker build -t "${_REG}/${svc}:${_TAG}" "${svc}"
        docker push "${_REG}/${svc}:${_TAG}"
      done

# Build and push frontend
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build & Push Frontend'
  entrypoint: bash
  args:
    - -c
    - |
      set -e
      echo "---- Building Frontend ----"
      docker build -t "${_REG}/${_FRONTEND}:${_TAG}" \
        --build-arg REACT_APP_API_URL="https://api-gateway-${_ENV}-347659003886.europe-west3.run.app/api" \
        "${_FRONTEND}"
      docker push "${_REG}/${_FRONTEND}:${_TAG}"

# Deploy each service to Cloud Run with environment suffix
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy Cloud Run'
  entrypoint: bash
  args:
    - -c
    - |
      set -e
      gcloud config set run/region ${_REGION}
      IFS=',' read -ra SRVS <<< "${_SERVICES}"
      for svc in "${SRVS[@]}"; do
        NAME="${svc}-${_ENV}"
        echo "---- Deploying $$NAME ----"
        gcloud run deploy "$$NAME" \
          --image "${_REG}/${svc}:${_TAG}" \
          --platform managed \
          --allow-unauthenticated \
          --update-env-vars "SPRING_PROFILES_ACTIVE=${_ENV},SERVER_PORT=8080"
      done

# Deploy frontend to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy Frontend'
  entrypoint: bash
  args:
    - -c
    - |
      set -e
      gcloud config set run/region ${_REGION}
      FRONTEND_NAME="${_FRONTEND}-${_ENV}"
      echo "---- Deploying $$FRONTEND_NAME ----"
      # API Gateway URL will be manually updated after getting the actual URL
      gcloud run deploy "$$FRONTEND_NAME" \
        --image "${_REG}/${_FRONTEND}:${_TAG}" \
        --platform managed \
        --allow-unauthenticated \
        --port 8080

images:
  - '${_REG}/api-gateway:${_TAG}'
  - '${_REG}/user-service:${_TAG}'
  - '${_REG}/course-service:${_TAG}'
  - '${_REG}/media-service:${_TAG}'
  - '${_REG}/payment-service:${_TAG}'
  - '${_REG}/notification-service:${_TAG}'
  - '${_REG}/frontend:${_TAG}' 