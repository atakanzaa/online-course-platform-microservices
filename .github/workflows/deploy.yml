name: Build & Deploy

on:
  push:
    branches:
      - develop
      - main

  # Manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add language-specific build/test here
      - name: Set up JDK 17 (example)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests
        run: ./mvnw test --batch-mode

      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.REGISTRY }}/${{ github.repository }}:$IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.REGISTRY }}/${{ github.repository }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Deploy
        run: |
          echo "Deploying commit ${{ github.sha }} to ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }} environment"
          # Example deploy command (replace with real script)
          ./scripts/deploy.sh ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }} ${{ env.IMAGE_TAG }} 